<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Live</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">  
    <link rel="stylesheet" href="style.css"> 
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.2/lib/index.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <!-- Header / Toolbar -->
    <header class="app-header">
        <div class="logo">
            <i data-lucide="file-text" class="logo-icon"></i>
            <h1>Markdown Live</h1>
        </div>
        <div class="toolbar">
            <button id="btn-sync" class="btn active" title="Đồng bộ cuộn trang">
                <i data-lucide="arrow-up-down"></i>
                <span>Sync Scroll</span>
            </button>
            <button id="btn-reset" class="btn" title="Khôi phục lại ví dụ mặc định">
                <i data-lucide="rotate-ccw"></i>
                <span>Reset</span>
            </button>
            <button id="btn-copy" class="btn" title="Sao chép nội dung Markdown">
                <i data-lucide="copy"></i>
                <span>Copy</span>
            </button>
            <button id="btn-pdf" class="btn btn-primary" title="Xuất file PDF">
                <i data-lucide="download"></i>
                <span>Export PDF</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
        <!-- Editor Column -->
        <section class="pane editor-pane">
            <div class="pane-header">
                <span>EDITOR</span>
                <span id="char-counter" class="counter">0 ký tự</span>
            </div>
            <div class="editor-container">
                <pre id="editor-highlight" class="editor-highlight" aria-hidden="true"><code id="editor-highlight-code"></code></pre>
                <textarea id="markdown-input" spellcheck="false" placeholder="Nhập Markdown tại đây..."></textarea>
            </div>
        </section>

        <!-- Preview Column -->
        <section class="pane preview-pane">
            <div class="pane-header">PREVIEW</div>
            <div id="preview-output" class="markdown-body"></div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">Thông báo ở đây</div>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
