<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Runner 3D - Fixed Endless Road</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 12px #00ffff;
            font-family: 'Courier New', Courier, monospace;
            z-index: 10;
            pointer-events: none;
            line-height: 1.6;
            background: rgba(5, 5, 20, 0.45);
            padding: 10px 18px;
            border-radius: 8px;
            border-left: 3px solid #00ffff;
        }
        .screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(8, 8, 24, 0.94);
            padding: 40px;
            border-radius: 16px;
            z-index: 20;
            min-width: 300px;
            backdrop-filter: blur(8px);
        }
        #start-screen {
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
        }
        #game-over-screen {
            display: none;
            border: 2px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
        }
        h1 {
            margin-top: 0;
            font-size: 40px;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }
        #start-screen h1 {
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff;
        }
        #game-over-screen h1 {
            color: #ff007f;
            text-shadow: 0 0 15px #ff007f;
        }
        p {
            font-size: 15px;
            color: #b8b8e0;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        button {
            border: none;
            padding: 14px 38px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        #btn-start {
            background: #00ffff;
            color: #050510;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }
        #btn-start:hover {
            background: #fff;
            box-shadow: 0 0 30px #fff;
            transform: scale(1.05);
        }
        #btn-restart {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
        }
        #btn-restart:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px #fff;
            transform: scale(1.05);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        SCORE: <span id="score-val">0</span><br>
        COINS: <span id="coin-val" style="color: #ffd700; text-shadow: 0 0 10px #ffd700;">0</span>
    </div>

    <!-- Màn hình bắt đầu -->
    <div id="start-screen" class="screen">
        <h1>NEON RUNNER</h1>
        <p>
            Thu thập xu vàng và sống sót trên đường chạy siêu tốc!<br>
            Tận dụng dốc cao để né tránh rào cản bên dưới.<br><br>
            <strong>Máy tính:</strong> A/D hoặc Mũi tên (Trái/Phải). Space/W (Nhảy).<br>
            <strong>Điện thoại:</strong> Chạm Trái/Phải để chuyển làn, Giữa để Nhảy.
        </p>
        <button id="btn-start" onclick="initGame()">Vào Trò Chơi</button>
    </div>

    <!-- Màn hình kết thúc -->
    <div id="game-over-screen" class="screen">
        <h1>GAME OVER</h1>
        <p>Tốc độ quá nhanh! Tổng điểm của bạn: <br><strong id="final-score" style="color: #00ffff; font-size: 26px; line-height: 2;">0</strong></p>
        <button id="btn-restart" onclick="resetGame()">Chơi Lại</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- CẤU HÌNH TRÒ CHƠI ---
        const LANES = [-2.5, 0, 2.5];
        let laneIndex = 1; 
        let gameRunning = false;
        let score = 0;
        let coinsCollected = 0;
        let speed = 30;
        const baseSpeed = 30;
        const maxSpeed = 75;
        
        // Vật lý
        let isJumping = false;
        let velocityY = 0;
        const gravity = 0.015;
        const jumpForce = 0.28;

        // Quản lý spawn
        let spawnTimer = 0;
        let spawnInterval = 1.6;
        let coinSpawnTimer = 0;
        let coinSpawnInterval = 0.7;
        let structSpawnTimer = 0;
        let structSpawnInterval = 7.5;

        // Quản lý phân đoạn đường (3-Segment Seamless System)
        const SEGMENT_LENGTH = 250;
        const NUM_SEGMENTS = 3;
        const TOTAL_ROAD_SPAN = SEGMENT_LENGTH * NUM_SEGMENTS; // 750 đơn vị
        let roadSegments = [];

        // Biến Three.js
        let scene, camera, renderer, clock;
        let player, shadowMesh;
        let carHoverGroup;       
        let carPulseParts = [];  
        let beaconLights = [];   
        let holoMaterials = [];  
        let hoverElapsed = 0;    
        let buildings = [];
        let obstacles = [];
        let coins = [];
        let activeStructures = []; 
        let starParticles;

        // Textures & Materials
        let windowMaterials = [];
        let holoTextures = [];
        let coinGeom, coinMat;

        // Web Audio API
        let audioCtx = null;
        let bgmIntervalId = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            clearInterval(bgmIntervalId);
            startBGM();
        }

        function playJumpSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function playCrashSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } catch(e) {}
        }

        function playCoinSound() {
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now);
                osc.frequency.setValueAtTime(1318.51, now + 0.08);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } catch(e) {}
        }

        function startBGM() {
            if (!audioCtx) return;
            let step = 0;
            const notes = [55, 55, 65.4, 65.4, 73.4, 73.4, 82.4, 82.4];
            function scheduleNextBeat() {
                if (!gameRunning) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                    step++;
                } catch(e) {}
            }
            bgmIntervalId = setInterval(scheduleNextBeat, 350);
        }

        // --- CÁC HÀM TẠO TEXTURE PROCEDURAL CANVAS ---
        function createSynthwaveSunTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            const grad = ctx.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0, '#fffb77');
            grad.addColorStop(0.35, '#ff007f');
            grad.addColorStop(1, '#660099');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(128, 128, 124, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#050510';
            for (let y = 120; y < 240; y += 12) {
                const h = 2 + (y - 120) * 0.07;
                ctx.fillRect(0, y, 256, h);
            }

            return new THREE.CanvasTexture(canvas);
        }

        function createBuildingTexture(neonTheme) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#080816';
            ctx.fillRect(0, 0, 128, 256);

            const colors = [neonTheme, '#00ffff', '#ffd700', '#ffffff', '#222244'];
            for (let y = 8; y < 248; y += 12) {
                for (let x = 6; x < 122; x += 10) {
                    if (Math.random() > 0.35) {
                        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                        ctx.globalAlpha = Math.random() > 0.25 ? (0.4 + Math.random() * 0.6) : 0.08;
                        ctx.fillRect(x, y, 6, 7);
                    }
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createHoloTexture(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 96;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(5, 5, 20, 0.75)';
            ctx.fillRect(0, 0, 256, 96);

            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.strokeRect(4, 4, 248, 88);

            ctx.font = 'bold 36px "Courier New", monospace';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            ctx.fillText(text, 128, 48);

            return new THREE.CanvasTexture(canvas);
        }

        // --- KHỞI TẠO THREE.JS ---
        function setupThreeJS() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x060515, 0.009);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.8, 6.5);
            camera.lookAt(0, 1.2, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            windowMaterials = [
                new THREE.MeshStandardMaterial({ map: createBuildingTexture('#00ffff'), roughness: 0.3, metalness: 0.8 }),
                new THREE.MeshStandardMaterial({ map: createBuildingTexture('#ff007f'), roughness: 0.3, metalness: 0.8 }),
                new THREE.MeshStandardMaterial({ map: createBuildingTexture('#9900ff'), roughness: 0.3, metalness: 0.8 })
            ];

            const holoWords = ['NEON', 'CYBER', '2088', 'TOKYO', 'SYNTH', 'RUNNER'];
            const holoColors = ['#00ffff', '#ff007f', '#00ff66', '#ffd700'];
            holoWords.forEach((word, i) => {
                holoTextures.push(createHoloTexture(word, holoColors[i % holoColors.length]));
            });

            coinGeom = new THREE.CylinderGeometry(0.4, 0.4, 0.15, 12);
            coinGeom.rotateX(Math.PI / 2);
            coinMat = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                emissive: 0xffaa00,
                emissiveIntensity: 1.6,
                metalness: 1.0,
                roughness: 0.1
            });

            const ambientLight = new THREE.AmbientLight(0x0f0c29, 1.2);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xff00aa, 1.0);
            dirLight.position.set(0, 20, -10);
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0x00ffff, 2.0, 40);
            pointLight.position.set(0, 4, -5);
            scene.add(pointLight);

            createEnvironment();
            createPlayer();
        }

        // Tạo một phân đoạn đường hoàn chỉnh (Road Segment)
        function createRoadSegment(zOffset) {
            const segGroup = new THREE.Group();

            // 1. Mặt đường nhựa tối bên dưới (chặn không cho thấy hư vô)
            const asphaltGeom = new THREE.PlaneGeometry(8.6, SEGMENT_LENGTH);
            const asphaltMat = new THREE.MeshBasicMaterial({ color: 0x03030c });
            const asphalt = new THREE.Mesh(asphaltGeom, asphaltMat);
            asphalt.rotation.x = -Math.PI / 2;
            asphalt.position.y = -0.03;
            segGroup.add(asphalt);

            // 2. Lưới dạ quang (Grid)
            const grid = new THREE.GridHelper(SEGMENT_LENGTH, 50, 0x00ffff, 0x330055);
            grid.position.y = -0.02;
            // Co giãn trục X của lưới vừa khít làn đường 8.6m
            grid.scale.set(8.6 / SEGMENT_LENGTH, 1, 1);
            segGroup.add(grid);

            // 3. Thanh Neon Guardrail biên đường Trái (Xanh lam) & Phải (Hồng tím)
            const railGeom = new THREE.BoxGeometry(0.12, 0.25, SEGMENT_LENGTH);
            
            const leftRailMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const leftRail = new THREE.Mesh(railGeom, leftRailMat);
            leftRail.position.set(-4.3, 0.1, 0);
            segGroup.add(leftRail);

            const rightRailMat = new THREE.MeshBasicMaterial({ color: 0xff007f });
            const rightRail = new THREE.Mesh(railGeom, rightRailMat);
            rightRail.position.set(4.3, 0.1, 0);
            segGroup.add(rightRail);

            // 4. Vạch kẻ phân làn neon
            const laneDivGeom = new THREE.BoxGeometry(0.04, 0.02, SEGMENT_LENGTH);
            const laneDivMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 });
            [-1.25, 1.25].forEach(lx => {
                const laneLine = new THREE.Mesh(laneDivGeom, laneDivMat);
                laneLine.position.set(lx, 0.01, 0);
                segGroup.add(laneLine);
            });

            segGroup.position.z = zOffset;
            scene.add(segGroup);
            return segGroup;
        }

        function createEnvironment() {
            // Khởi tạo 3 phân đoạn đường nối tiếp nhau: 0, -250, -500
            for (let i = 0; i < NUM_SEGMENTS; i++) {
                const seg = createRoadSegment(-i * SEGMENT_LENGTH);
                roadSegments.push(seg);
            }

            // Mặt trời Synthwave Scanlines
            const sunTex = createSynthwaveSunTexture();
            const sunGeom = new THREE.PlaneGeometry(65, 65);
            const sunMat = new THREE.MeshBasicMaterial({ map: sunTex, transparent: true, depthWrite: false });
            const sunMesh = new THREE.Mesh(sunGeom, sunMat);
            sunMesh.position.set(0, 18, -280);
            scene.add(sunMesh);

            const glowGeom = new THREE.PlaneGeometry(100, 100);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xff007f, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false
            });
            const glowMesh = new THREE.Mesh(glowGeom, glowMat);
            glowMesh.position.set(0, 18, -285);
            scene.add(glowMesh);

            createHorizonMountains();

            for (let i = 0; i < 28; i++) {
                spawnBuilding(i);
            }

            // Bụi sao không gian
            const starCount = 220;
            const starGeometry = new THREE.BufferGeometry();
            const starPositions = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount * 3; i += 3) {
                starPositions[i] = (Math.random() - 0.5) * 140;
                starPositions[i+1] = Math.random() * 50;
                starPositions[i+2] = -Math.random() * 300;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starMaterial = new THREE.PointsMaterial({
                color: 0x00ffff, size: 0.28, transparent: true, opacity: 0.85
            });
            starParticles = new THREE.Points(starGeometry, starMaterial);
            scene.add(starParticles);
        }

        function createHorizonMountains() {
            const mGeom = new THREE.PlaneGeometry(360, 45, 24, 4);
            const pos = mGeom.attributes.position;
            
            for (let i = 0; i < pos.count; i++) {
                const y = pos.getY(i);
                if (y > 0) {
                    const noise = Math.sin(i * 1.5) * 8 + Math.cos(i * 3.2) * 5;
                    pos.setY(i, y + noise);
                }
            }
            mGeom.computeVertexNormals();

            const mMat = new THREE.MeshBasicMaterial({ color: 0x0a0520 });
            const mountainMesh = new THREE.Mesh(mGeom, mMat);
            mountainMesh.position.set(0, 10, -270);
            scene.add(mountainMesh);

            const mWireMat = new THREE.MeshBasicMaterial({
                color: 0x440077, wireframe: true, transparent: true, opacity: 0.4
            });
            const mountainWire = new THREE.Mesh(mGeom, mWireMat);
            mountainWire.position.set(0, 10.1, -269.8);
            scene.add(mountainWire);
        }

        function spawnBuilding(index) {
            const bGroup = new THREE.Group();

            const h = 14 + Math.random() * 28;
            const w = 7 + Math.random() * 6;
            const d = 8 + Math.random() * 8;
            
            const matIndex = Math.floor(Math.random() * windowMaterials.length);
            const mainMat = windowMaterials[matIndex];
            const neonColors = [0x00ffff, 0xff007f, 0x9900ff, 0x00ffaa];
            const neonColor = neonColors[matIndex % neonColors.length];

            const geom = new THREE.BoxGeometry(w, h, d);
            const mainBuilding = new THREE.Mesh(geom, mainMat);
            mainBuilding.position.y = h / 2 - 0.5;
            bGroup.add(mainBuilding);

            const edges = new THREE.EdgesGeometry(geom);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: neonColor, linewidth: 1 }));
            mainBuilding.add(line);

            const roofType = Math.random();
            if (roofType > 0.6) {
                const antHeight = 4 + Math.random() * 5;
                const antGeom = new THREE.CylinderGeometry(0.08, 0.15, antHeight, 6);
                const antMat = new THREE.MeshBasicMaterial({ color: 0x8888aa });
                const antenna = new THREE.Mesh(antGeom, antMat);
                antenna.position.set(0, h + antHeight / 2 - 0.5, 0);
                bGroup.add(antenna);

                const beaconGeom = new THREE.SphereGeometry(0.35, 8, 8);
                const beaconMat = new THREE.MeshBasicMaterial({ color: 0xff0044 });
                const beacon = new THREE.Mesh(beaconGeom, beaconMat);
                beacon.position.set(0, h + antHeight - 0.5, 0);
                bGroup.add(beacon);

                beaconLights.push({ mat: beaconMat, speed: 4 + Math.random() * 4, offset: Math.random() * Math.PI });
            } else if (roofType > 0.25) {
                const holoTex = holoTextures[Math.floor(Math.random() * holoTextures.length)];
                const holoGeom = new THREE.PlaneGeometry(5.5, 2.2);
                const holoMat = new THREE.MeshBasicMaterial({
                    map: holoTex, transparent: true, opacity: 0.85, side: THREE.DoubleSide
                });
                const holoMesh = new THREE.Mesh(holoGeom, holoMat);
                holoMesh.position.set(0, h + 1.2, 0);
                holoMesh.rotation.y = (Math.random() - 0.5) * 0.4;
                bGroup.add(holoMesh);

                holoMaterials.push(holoMat);
            } else {
                const subW = w * 0.6;
                const subH = 3 + Math.random() * 4;
                const subD = d * 0.6;
                const subGeom = new THREE.BoxGeometry(subW, subH, subD);
                const subMesh = new THREE.Mesh(subGeom, mainMat);
                subMesh.position.set(0, h + subH / 2 - 0.5, 0);
                
                const subEdges = new THREE.EdgesGeometry(subGeom);
                subMesh.add(new THREE.LineSegments(subEdges, new THREE.LineBasicMaterial({ color: 0xffffff })));
                bGroup.add(subMesh);
            }

            const side = Math.random() > 0.5 ? 1 : -1;
            bGroup.position.x = side * (13 + Math.random() * 16);
            bGroup.position.z = -10 - (index * 11);

            scene.add(bGroup);
            buildings.push(bGroup);
        }

        function createPlayer() {
            player = new THREE.Group();
            player.position.set(LANES[laneIndex], 0.3, 0);
            scene.add(player);

            carHoverGroup = new THREE.Group();
            player.add(carHoverGroup);

            const hullMat = new THREE.MeshStandardMaterial({
                color: 0x091428, emissive: 0x00ffff, emissiveIntensity: 0.3,
                metalness: 0.9, roughness: 0.2
            });
            const canopyMat = new THREE.MeshPhysicalMaterial({
                color: 0x113355, emissive: 0x00ffff, emissiveIntensity: 0.6,
                metalness: 0.1, roughness: 0.05, transparent: true, opacity: 0.6
            });
            const cyanGlowMat = new THREE.MeshStandardMaterial({
                color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 2.0
            });
            const coreGlowMat = new THREE.MeshBasicMaterial({
                color: 0xffe0ff, transparent: true, opacity: 0.9,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const flameMat = new THREE.MeshBasicMaterial({
                color: 0xff007f, transparent: true, opacity: 0.6,
                blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
            });
            const fieldGlowMat = new THREE.MeshBasicMaterial({
                color: 0x00ffff, transparent: true, opacity: 0.25,
                blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
            });

            function addEdgeGlow(mesh, geom, color) {
                const edges = new THREE.EdgesGeometry(geom);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: color }));
                mesh.add(line);
            }

            const chassisGeom = new THREE.BoxGeometry(1.05, 0.24, 1.4);
            const chassis = new THREE.Mesh(chassisGeom, hullMat);
            chassis.position.set(0, -0.03, 0.05);
            addEdgeGlow(chassis, chassisGeom, 0x00ffff);
            carHoverGroup.add(chassis);

            const noseGeom = new THREE.ConeGeometry(0.5, 0.65, 4);
            const nose = new THREE.Mesh(noseGeom, hullMat);
            nose.rotation.x = -Math.PI / 2;
            nose.rotation.y = Math.PI / 4;
            nose.scale.set(1, 1, 0.42);
            nose.position.set(0, -0.03, -0.95);
            carHoverGroup.add(nose);

            const headlightGeom = new THREE.BoxGeometry(0.55, 0.05, 0.05);
            const headlight = new THREE.Mesh(headlightGeom, cyanGlowMat);
            headlight.position.set(0, -0.05, -1.28);
            carHoverGroup.add(headlight);

            const canopyGeom = new THREE.SphereGeometry(0.4, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2);
            const canopy = new THREE.Mesh(canopyGeom, canopyMat);
            canopy.scale.set(1, 0.6, 1.3);
            canopy.position.set(0, 0.11, 0.1);
            carHoverGroup.add(canopy);

            const spoilerGeom = new THREE.BoxGeometry(1.2, 0.05, 0.22);
            const spoiler = new THREE.Mesh(spoilerGeom, hullMat);
            spoiler.position.set(0, 0.32, 0.68);
            addEdgeGlow(spoiler, spoilerGeom, 0xff007f);
            carHoverGroup.add(spoiler);

            const strutGeom = new THREE.BoxGeometry(0.05, 0.22, 0.05);
            [-0.45, 0.45].forEach(sx => {
                const strut = new THREE.Mesh(strutGeom, hullMat);
                strut.position.set(sx, 0.19, 0.68);
                carHoverGroup.add(strut);
            });

            const podGeom = new THREE.CylinderGeometry(0.2, 0.24, 0.06, 16);
            const ringGeom = new THREE.TorusGeometry(0.22, 0.03, 6, 16);
            const podPositions = [
                [-0.42, -0.55], [0.42, -0.55],
                [-0.42, 0.55], [0.42, 0.55]
            ];
            podPositions.forEach(([px, pz]) => {
                const pod = new THREE.Mesh(podGeom, cyanGlowMat);
                pod.position.set(px, -0.22, pz);
                carHoverGroup.add(pod);

                const ring = new THREE.Mesh(ringGeom, cyanGlowMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.set(px, -0.26, pz);
                carHoverGroup.add(ring);
            });

            const fieldGeom = new THREE.CircleGeometry(0.72, 24);
            const fieldGlow = new THREE.Mesh(fieldGeom, fieldGlowMat);
            fieldGlow.rotation.x = -Math.PI / 2;
            fieldGlow.position.set(0, -0.29, 0.05);
            carHoverGroup.add(fieldGlow);

            const nozzleGeom = new THREE.CylinderGeometry(0.16, 0.19, 0.3, 12);
            const coreGeom = new THREE.CircleGeometry(0.13, 12);
            const flameGeom = new THREE.ConeGeometry(0.13, 0.45, 8);
            [-0.32, 0.32].forEach(nx => {
                const nozzle = new THREE.Mesh(nozzleGeom, hullMat);
                nozzle.rotation.x = Math.PI / 2;
                nozzle.position.set(nx, -0.02, 0.78);
                carHoverGroup.add(nozzle);

                const core = new THREE.Mesh(coreGeom, coreGlowMat);
                core.position.set(nx, -0.02, 0.94);
                carHoverGroup.add(core);

                const flame = new THREE.Mesh(flameGeom, flameMat);
                flame.rotation.x = Math.PI / 2;
                flame.position.set(nx, -0.02, 1.05);
                carHoverGroup.add(flame);

                carPulseParts.push({ mat: flameMat, prop: 'opacity', base: 0.5, amp: 0.25, speed: 10, phase: nx * 4 });
            });

            carPulseParts.push({ mat: cyanGlowMat, prop: 'emissiveIntensity', base: 1.8, amp: 0.6, speed: 4.5, phase: 0 });
            carPulseParts.push({ mat: fieldGlowMat, prop: 'opacity', base: 0.22, amp: 0.1, speed: 3, phase: 0.5 });

            const shadowGeom = new THREE.PlaneGeometry(1.3, 2.2);
            const shadowMat = new THREE.MeshBasicMaterial({
                color: 0x000000, transparent: true, opacity: 0.6, depthWrite: false
            });
            shadowMesh = new THREE.Mesh(shadowGeom, shadowMat);
            shadowMesh.rotation.x = -Math.PI / 2;
            shadowMesh.position.y = 0.01;
            scene.add(shadowMesh);
        }

        // --- CƠ CHẾ VẬT THỂ & DỐC ---
        function isZoneBlocked(lane) {
            for (let struct of activeStructures) {
                if (struct.lane === lane) return true;
            }
            return false;
        }

        function spawnObstacle() {
            const lane = LANES[Math.floor(Math.random() * LANES.length)];
            if (isZoneBlocked(lane)) return;

            const isTall = Math.random() > 0.45;
            let geom, mat, yPos, height, width;
            if (isTall) {
                width = 1.4;
                height = 2.4;
                geom = new THREE.BoxGeometry(width, height, 0.8);
                mat = new THREE.MeshStandardMaterial({
                    color: 0xff0044, emissive: 0xff0044, emissiveIntensity: 1.8
                });
                yPos = height / 2;
            } else {
                width = 1.8;
                height = 0.6;
                geom = new THREE.BoxGeometry(width, height, 0.8);
                mat = new THREE.MeshStandardMaterial({
                    color: 0xffaa00, emissive: 0xffaa00, emissiveIntensity: 1.8
                });
                yPos = height / 2;
            }

            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(lane, yPos, -200);

            const edges = new THREE.EdgesGeometry(geom);
            mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 })));

            mesh.userData = { isTall, width, height, depth: 0.8 };
            scene.add(mesh);
            obstacles.push(mesh);
        }

        function spawnCoin(lane, y, z) {
            const mesh = new THREE.Mesh(coinGeom, coinMat);
            mesh.position.set(lane, y, z);
            mesh.userData = { spinSpeed: 2.5 + Math.random() * 2 };
            scene.add(mesh);
            coins.push(mesh);
        }

        function spawnRandomCoin() {
            const lane = LANES[Math.floor(Math.random() * LANES.length)];
            const zStart = -180;
            if (isZoneBlocked(lane)) return;

            const isHigh = Math.random() > 0.7;
            spawnCoin(lane, isHigh ? 1.8 : 0.6, zStart);
        }

        function spawnStructure() {
            const lane = LANES[Math.floor(Math.random() * LANES.length)];
            const zStart = -200;
            const platformHeight = 2.0;
            const rampLength = 14;
            const platformLength = 40;

            const rampGeom = new THREE.BoxGeometry(2.0, 0.15, rampLength);
            const rampMat = new THREE.MeshStandardMaterial({
                color: 0x050518, roughness: 0.4, emissive: 0x00ffff, emissiveIntensity: 0.15
            });
            const rampMesh = new THREE.Mesh(rampGeom, rampMat);
            rampMesh.position.set(lane, platformHeight / 2, zStart);
            rampMesh.rotation.x = Math.asin(platformHeight / rampLength);

            const rampEdges = new THREE.EdgesGeometry(rampGeom);
            rampMesh.add(new THREE.LineSegments(rampEdges, new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 })));
            scene.add(rampMesh);

            const platformGeom = new THREE.BoxGeometry(2.0, platformHeight, platformLength);
            const platformMat = new THREE.MeshStandardMaterial({
                color: 0x050518, roughness: 0.4, emissive: 0xff00ff, emissiveIntensity: 0.15
            });
            const platformMesh = new THREE.Mesh(platformGeom, platformMat);
            const platformZ = zStart - rampLength / 2 - platformLength / 2;
            platformMesh.position.set(lane, platformHeight / 2, platformZ);

            const platformEdges = new THREE.EdgesGeometry(platformGeom);
            platformMesh.add(new THREE.LineSegments(platformEdges, new THREE.LineBasicMaterial({ color: 0xff00ff, linewidth: 2 })));
            scene.add(platformMesh);

            for (let i = 0; i < 4; i++) {
                const coinZ = platformZ + platformLength / 2 - 4 - (i * (platformLength / 4.5));
                spawnCoin(lane, platformHeight + 0.6, coinZ);
            }

            activeStructures.push({
                lane, platformHeight, rampLength, platformLength, rampMesh, platformMesh
            });
        }

        function canMoveToLane(targetIndex) {
            const targetLaneX = LANES[targetIndex];
            for (let struct of activeStructures) {
                if (struct.lane === targetLaneX) {
                    const rZ = struct.rampMesh.position.z;
                    const rLen = struct.rampLength;
                    const pZ = struct.platformMesh.position.z;
                    const pLen = struct.platformLength;

                    if ((pZ - pLen/2) <= 0 && (pZ + pLen/2) >= 0) {
                        if (player.position.y < struct.platformHeight + 0.15) return false;
                    }
                    if ((rZ - rLen/2) <= 0 && (rZ + rLen/2) >= 0) {
                        const ratio = (rZ + rLen/2) / rLen;
                        if (player.position.y < (0.3 + ratio * struct.platformHeight) - 0.2) return false;
                    }
                }
            }
            return true;
        }

        function checkCollisions() {
            const pMinX = player.position.x - 0.6;
            const pMaxX = player.position.x + 0.6;
            const pMinY = player.position.y - 0.3;
            const pMaxY = player.position.y + 0.3;
            const pMinZ = player.position.z - 1.0;
            const pMaxZ = player.position.z + 1.0;

            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                const w = obs.userData.width / 2;
                const h = obs.userData.height / 2;
                const d = obs.userData.depth / 2;

                if (pMinX <= obs.position.x + w && pMaxX >= obs.position.x - w &&
                    pMinY <= obs.position.y + h && pMaxY >= obs.position.y - h &&
                    pMinZ <= obs.position.z + d && pMaxZ >= obs.position.z - d) {
                    endGame();
                    return;
                }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                if (player.position.distanceToSquared(coin.position) < 1.45) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                    coinsCollected++;
                    score += 150;
                    document.getElementById('coin-val').innerText = coinsCollected;
                    playCoinSound();
                }
            }
        }

        function handleInput(dir) {
            if (!gameRunning) return;
            if (dir === 'left' && laneIndex > 0 && canMoveToLane(laneIndex - 1)) {
                laneIndex--;
            } else if (dir === 'right' && laneIndex < 2 && canMoveToLane(laneIndex + 1)) {
                laneIndex++;
            } else if (dir === 'jump' && !isJumping) {
                isJumping = true;
                velocityY = jumpForce;
                playJumpSound();
            }
        }

        window.addEventListener('keydown', (e) => {
            const keys = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS', 'Space'];
            if (keys.includes(e.code)) e.preventDefault();
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') handleInput('left');
            if (e.code === 'ArrowRight' || e.code === 'KeyD') handleInput('right');
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') handleInput('jump');
        });

        window.addEventListener('touchstart', (e) => {
            if (!gameRunning) return;
            const touchX = e.touches[0].clientX;
            const width = window.innerWidth;
            if (touchX < width * 0.35) handleInput('left');
            else if (touchX > width * 0.65) handleInput('right');
            else handleInput('jump');
        });

        // --- VÒNG LẶP CHÍNH (TICK LOOP) ---
        function tick() {
            if (!gameRunning) return;
            requestAnimationFrame(tick);

            const dt = Math.min(clock.getDelta(), 0.1); 

            if (speed < maxSpeed) speed += 0.4 * dt;
            score += Math.floor(speed * 0.08);
            document.getElementById('score-val').innerText = score;

            // 1. CUỘN 3 PHÂN ĐOẠN ĐƯỜNG LIỀN MẠCH (KHÔNG BAO GIỜ MẤT NỀN)
            for (let i = 0; i < roadSegments.length; i++) {
                const seg = roadSegments[i];
                seg.position.z += speed * dt;
                
                // Khi một đoạn đường trôi hẳn ra phía sau camera (vượt quá SEGMENT_LENGTH)
                if (seg.position.z >= SEGMENT_LENGTH) {
                    seg.position.z -= TOTAL_ROAD_SPAN; // Đưa thẳng về phía xa nhất (-500)
                }
            }

            // 2. Di chuyển các tòa nhà hai bên
            for (let i = 0; i < buildings.length; i++) {
                const b = buildings[i];
                b.position.z += speed * dt;
                if (b.position.z > 25) {
                    b.position.z = -260 - Math.random() * 20;
                    b.position.x = (Math.random() > 0.5 ? 1 : -1) * (13 + Math.random() * 16);
                }
            }

            // 3. Đèn ăng-ten & Biển hiệu Hologram
            hoverElapsed += dt;
            for (let b of beaconLights) {
                b.mat.opacity = Math.sin(hoverElapsed * b.speed + b.offset) > 0 ? 1.0 : 0.15;
                b.mat.transparent = true;
            }
            for (let hMat of holoMaterials) {
                hMat.opacity = 0.75 + Math.sin(hoverElapsed * 5) * 0.2;
            }

            // 4. Bụi sao
            const pos = starParticles.geometry.attributes.position.array;
            for (let i = 2; i < pos.length; i += 3) {
                pos[i] += speed * 1.5 * dt;
                if (pos[i] > 10) {
                    pos[i] = -280;
                    pos[i-1] = Math.random() * 50;
                    pos[i-2] = (Math.random() - 0.5) * 140;
                }
            }
            starParticles.geometry.attributes.position.needsUpdate = true;

            // 5. Cao độ leo dốc & Vật lý nhân vật
            let currentFloorY = 0.3;
            for (let i = activeStructures.length - 1; i >= 0; i--) {
                const s = activeStructures[i];
                s.rampMesh.position.z += speed * dt;
                s.platformMesh.position.z += speed * dt;

                if (s.platformMesh.position.z - s.platformLength / 2 > 15) {
                    scene.remove(s.rampMesh);
                    scene.remove(s.platformMesh);
                    activeStructures.splice(i, 1);
                    continue;
                }

                if (Math.abs(player.position.x - s.lane) < 0.95) {
                    const rFront = s.rampMesh.position.z + s.rampLength / 2;
                    const rBack = s.rampMesh.position.z - s.rampLength / 2;
                    if (rBack <= 0 && rFront >= 0) {
                        currentFloorY = 0.3 + (rFront / s.rampLength) * s.platformHeight;
                    }
                    const pFront = s.platformMesh.position.z + s.platformLength / 2;
                    const pBack = s.platformMesh.position.z - s.platformLength / 2;
                    if (pBack <= 0 && pFront >= 0) {
                        currentFloorY = 0.3 + s.platformHeight;
                    }
                }
            }

            // Trọng lực
            if (!isJumping) {
                if (player.position.y > currentFloorY + 0.05) {
                    isJumping = true;
                    velocityY = 0;
                } else {
                    player.position.y = currentFloorY;
                }
            } else {
                player.position.y += velocityY * dt * 60;
                velocityY -= gravity * dt * 60;
                if (player.position.y <= currentFloorY) {
                    player.position.y = currentFloorY;
                    isJumping = false;
                    velocityY = 0;
                }
            }

            // Chuyển làn
            const targetX = LANES[laneIndex];
            player.position.x += (targetX - player.position.x) * 12 * dt;
            player.rotation.z = -(targetX - player.position.x) * 0.15;
            player.rotation.y = (targetX - player.position.x) * 0.08;

            // Hover xe
            carHoverGroup.position.y = Math.sin(hoverElapsed * 3.5) * 0.04;
            carHoverGroup.rotation.z = Math.sin(hoverElapsed * 2.2) * 0.015;

            for (let i = 0; i < carPulseParts.length; i++) {
                const p = carPulseParts[i];
                p.mat[p.prop] = p.base + Math.sin(hoverElapsed * p.speed + p.phase) * p.amp;
            }

            shadowMesh.position.x = player.position.x;
            const scaleFactor = Math.max(0.1, 1 - (player.position.y - 0.3) * 0.4);
            shadowMesh.scale.set(scaleFactor, scaleFactor, 1);

            // Đồng xu
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.position.z += speed * dt;
                coin.rotation.y += coin.userData.spinSpeed * dt;
                if (coin.position.z > 15) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }

            // Vật cản
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += speed * dt;
                if (obs.position.z > 15) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // Chu kỳ tạo mới
            spawnTimer += dt;
            const currentObsInterval = Math.max(0.65, spawnInterval - (speed - baseSpeed) * 0.018);
            if (spawnTimer >= currentObsInterval) {
                spawnTimer = 0;
                spawnObstacle();
            }

            coinSpawnTimer += dt;
            if (coinSpawnTimer >= coinSpawnInterval) {
                coinSpawnTimer = 0;
                spawnRandomCoin();
            }

            structSpawnTimer += dt;
            if (structSpawnTimer >= structSpawnInterval) {
                structSpawnTimer = 0;
                spawnStructure();
            }

            checkCollisions();

            camera.position.x += (player.position.x * 0.35 - camera.position.x) * 4 * dt;
            renderer.render(scene, camera);
        }

        // --- KHỞI CHẠY & RESET ---
        function initGame() {
            document.getElementById('start-screen').style.display = 'none';
            initAudio();
            setupThreeJS();
            gameRunning = true;
            clock.getDelta();
            tick();
        }

        function endGame() {
            gameRunning = false;
            playCrashSound();
            clearInterval(bgmIntervalId);
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').style.display = 'block';
        }

        function resetGame() {
            for (let c of coins) scene.remove(c);
            coins = [];
            for (let o of obstacles) scene.remove(o);
            obstacles = [];
            for (let s of activeStructures) {
                scene.remove(s.rampMesh);
                scene.remove(s.platformMesh);
            }
            activeStructures = [];

            // Đặt lại vị trí 3 phân đoạn đường liền nhau
            for (let i = 0; i < roadSegments.length; i++) {
                roadSegments[i].position.z = -i * SEGMENT_LENGTH;
            }

            laneIndex = 1;
            player.position.set(LANES[laneIndex], 0.3, 0);
            isJumping = false;
            velocityY = 0;
            score = 0;
            coinsCollected = 0;
            speed = baseSpeed;
            spawnTimer = 0;
            coinSpawnTimer = 0;
            structSpawnTimer = 0;

            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('score-val').innerText = '0';
            document.getElementById('coin-val').innerText = '0';

            initAudio();
            gameRunning = true;
            clock.getDelta();
            tick();
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
